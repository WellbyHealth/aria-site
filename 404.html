<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Aria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..800&display=swap">
<style>
:root{--bg:#eef6ff;--card:#ffffff;--ink:#0a2540;--body:#425466;--line:#e3e8ee;--pop:#ba2997;--btn:#0a2540;--btn-ink:#ffffff;--focus:#0b6bcb}
@media (prefers-color-scheme:dark){:root{--bg:#061325;--card:#0f2541;--ink:#f6f9fc;--body:#c5cfdc;--line:#2a4266;--pop:#f08bd6;--btn:#f6f9fc;--btn-ink:#0a2540;--focus:#ced748}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 80% at 70% 0%,color-mix(in srgb,var(--bg) 70%,#bfe0fa),var(--bg));color:var(--ink);
  font-family:Figtree,system-ui,-apple-system,Segoe UI,sans-serif;display:flex;flex-direction:column;min-height:100%}
header{padding:20px 24px}
.logo{display:inline-flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;font-weight:700;font-size:1.4rem;letter-spacing:-.03em;min-height:44px}
.logo img{width:30px;height:auto}
@font-face{font-family:Outfit;font-weight:500;font-display:swap;src:url(/assets/fonts/outfit-latin-500-normal.woff2) format("woff2")}
.logo span{font-family:Outfit,Figtree,system-ui,sans-serif;font-weight:500;letter-spacing:-.02em}
main{flex:1;display:grid;place-items:center;padding:24px 16px 64px}
.card{width:min(560px,100%);background:var(--card);border:1px solid var(--line);border-radius:32px;padding:clamp(28px,6vw,48px);text-align:center;
  box-shadow:0 30px 60px -40px rgba(10,37,64,.45)}
.num{display:block;font-size:clamp(4.5rem,22vw,7.5rem);font-weight:800;line-height:1;letter-spacing:-.06em;color:var(--pop)}
h1{margin:14px 0 26px;font-size:clamp(1.5rem,6vw,2rem);font-weight:600;letter-spacing:-.03em;line-height:1.15}
nav{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
nav a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border-radius:999px;font-weight:600;text-decoration:none;
  color:var(--ink);border:1px solid var(--line);background:transparent}
nav a.primary{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
a:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
</style>
</head>
<body>
<header><a class="logo" href="/"><img src="/assets/aria-mark-145x160.webp" alt="" width="145" height="160"><span>Aria</span></a></header>
<main>
  <div class="card">
    <span class="num" aria-hidden="true">404</span>
    <h1>An AI CFO for your practice.</h1>
    <nav aria-label="Aria">
      <a class="primary" href="/#waitlist">Join the waitlist</a>
      <a href="/">Overview</a>
      <a href="/#products">All products</a>
    </nav>
  </div>
</main>
</body>
</html>
